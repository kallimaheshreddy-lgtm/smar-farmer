{% extends "base.html" %}

{% block title %}{{ action }} Crop Plot — Smart Farmer AI{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card border-0 shadow-sm bg-white" style="border-radius: var(--radius-lg);">
      <div class="card-header bg-white border-0 pt-4 px-4 pb-0">
        <h3 class="fw-bold text-dark"><i class="fa-solid fa-seedling text-success me-2"></i> {{ action }} Crop Plot</h3>
        <p class="text-muted small">Record crop planting details, variety, and expected harvest dates.</p>
      </div>
      <div class="card-body p-4">
        <form method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

          <div class="mb-3">
            <label class="form-label fw-semibold">Crop Name <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control" placeholder="e.g. Rice, Cotton, Tomato, Wheat, Chilli" value="{{ crop.name if crop else '' }}" required>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Crop Variety / Hybrid</label>
              <input type="text" name="variety" class="form-control" placeholder="e.g. Samba Mahsuri (BPT 5204), Bt Cotton" value="{{ crop.variety if crop else '' }}">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Field Name / Plot Identifier</label>
              <input type="text" name="field_name" class="form-control" placeholder="e.g. North Acre, Well Plot" value="{{ crop.field_name if crop else 'Main Plot' }}">
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Area (Acres) <span class="text-danger">*</span></label>
              <input type="number" step="0.1" name="area_acres" class="form-control" placeholder="e.g. 2.5" value="{{ crop.area_acres if crop else '1.0' }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Growth Status</label>
              <select name="status" class="form-select">
                <option value="Growing" {% if crop and crop.status == 'Growing' %}selected{% endif %}>Growing</option>
                <option value="Flowering" {% if crop and crop.status == 'Flowering' %}selected{% endif %}>Flowering</option>
                <option value="Harvesting" {% if crop and crop.status == 'Harvesting' %}selected{% endif %}>Harvesting</option>
                <option value="Completed" {% if crop and crop.status == 'Completed' %}selected{% endif %}>Completed / Harvested</option>
              </select>
            </div>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Sowing / Planting Date</label>
              <input type="date" name="planting_date" class="form-control" value="{{ crop.planting_date.strftime('%Y-%m-%d') if crop and crop.planting_date else '' }}">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Expected Harvest Date</label>
              <input type="date" name="expected_harvest_date" class="form-control" value="{{ crop.expected_harvest_date.strftime('%Y-%m-%d') if crop and crop.expected_harvest_date else '' }}">
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center">
            <a href="{{ url_for('farm.index') }}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-farmer-primary fw-bold px-4">{{ action }} Crop Record</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
