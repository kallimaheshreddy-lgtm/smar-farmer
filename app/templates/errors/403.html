{% extends "base.html" %}

{% block title %}Access Forbidden — Smart Farmer AI{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-7 text-center">
    <div class="card border-0 shadow-sm bg-white p-5" style="border-radius: var(--radius-lg);">
      <div class="display-1 fw-bold text-danger mb-2">403</div>
      <h3 class="fw-bold text-dark mb-2">Access Denied</h3>
      <p class="text-muted small mb-4">You do not have permission to view or modify this farmer's private data or admin resource.</p>
      <div>
        <a href="{{ url_for('main.index') }}" class="btn btn-farmer-primary">Return to Home</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
