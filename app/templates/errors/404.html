{% extends "base.html" %}

{% block title %}Page Not Found — Smart Farmer AI{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-7 text-center">
    <div class="card border-0 shadow-sm bg-white p-5" style="border-radius: var(--radius-lg);">
      <div class="display-1 fw-bold text-success mb-2">404</div>
      <h3 class="fw-bold text-dark mb-2">Page Not Found</h3>
      <p class="text-muted small mb-4">The agricultural resource, record, or tool you are looking for does not exist or may have been moved.</p>
      <div>
        <a href="{{ url_for('main.index') }}" class="btn btn-farmer-primary me-2">Back to Home</a>
        <a href="{{ url_for('main.dashboard') }}" class="btn btn-outline-secondary">Go to Dashboard</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
