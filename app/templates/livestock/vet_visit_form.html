{% extends "base.html" %}

{% block title %}Log Veterinary Consultation — Smart Farmer AI{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card border-0 shadow-sm bg-white" style="border-radius: var(--radius-lg);">
      <div class="card-header bg-white border-0 pt-4 px-4 pb-0">
        <h3 class="fw-bold text-dark"><i class="fa-solid fa-stethoscope text-danger me-2"></i> Log Veterinary Consultation</h3>
        <p class="text-muted small">Record professional veterinary advice, diagnoses, follow-up dates, and expenses.</p>
      </div>
      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('livestock.add_vet_visit') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

          <div class="mb-3">
            <label class="form-label fw-semibold">Select Animal Profile (Optional)</label>
            <select name="livestock_id" class="form-select">
              <option value="">General Herd Consultation</option>
              {% for a in animals %}
              <option value="{{ a.id }}">Tag #{{ a.tag_id }} ({{ a.species }}, {{ a.breed or 'Indigenous' }})</option>
              {% endfor %}
            </select>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Veterinarian Name <span class="text-danger">*</span></label>
              <input type="text" name="vet_name" class="form-control" placeholder="e.g. Dr. K. Srinivas Rao, BVSc" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Clinic / Hospital Name</label>
              <input type="text" name="clinic_name" class="form-control" placeholder="e.g. Govt Veterinary Dispensary, Warangal">
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Phone / Mobile</label>
              <input type="text" name="phone" class="form-control" placeholder="e.g. 9848011223">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Consultation Date</label>
              <input type="date" name="visit_date" class="form-control">
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Reason for Visit / Symptoms Noticed <span class="text-danger">*</span></label>
            <input type="text" name="reason" class="form-control" placeholder="e.g. Severe mastitis in left hind quarter, high fever" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Diagnosis & Observations from Veterinarian</label>
            <textarea name="diagnosis_notes" class="form-control" rows="2" placeholder="e.g. Acute clinical mastitis, CMT positive, temperature 104.2 F"></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Official Medical Advice & Instructions Received</label>
            <textarea name="advice_given" class="form-control" rows="2" placeholder="e.g. Administered prescribed therapy; keep in dry sand bedding, milk out hourly, follow-up in 2 days"></textarea>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Follow-up Date (if advised)</label>
              <input type="date" name="follow_up_date" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Total Cost Incurred (₹)</label>
              <input type="number" step="1" name="cost" class="form-control" placeholder="e.g. 450" value="0">
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center">
            <a href="{{ url_for('livestock.index') }}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-farmer-primary fw-bold px-4">Save Consultation Record</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
