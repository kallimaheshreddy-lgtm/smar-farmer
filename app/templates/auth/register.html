{% extends "base.html" %}

{% block title %}{{ t('register') }} — Smart Farmer AI{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-7 col-lg-6">
    <div class="card border-0 shadow-sm bg-white" style="border-radius: var(--radius-lg);">
      <div class="card-header bg-white border-0 pt-4 px-4 pb-0 text-center">
        <div class="card-icon-box card-icon-green mx-auto mb-2">
          <i class="fa-solid fa-user-plus text-success"></i>
        </div>
        <h3 class="fw-bold text-dark mb-1">{{ t('register') }} as a Farmer</h3>
        <p class="text-muted small">Register to save your farm crops, livestock health logs, and localized advisories.</p>
      </div>

      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('auth.register') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

          <div class="mb-3">
            <label class="form-label fw-semibold">Farmer Full Name <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control" placeholder="e.g. Ramesh Kumar" required>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
              <input type="email" name="email" class="form-control" placeholder="farmer@example.com" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Mobile Number</label>
              <input type="tel" name="phone" class="form-control" placeholder="e.g. 9848012345">
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label class="form-label fw-semibold">State</label>
              <input type="text" name="state" class="form-control" placeholder="e.g. Telangana" value="Telangana">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">District</label>
              <input type="text" name="district" class="form-control" placeholder="e.g. Warangal" value="Warangal">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Preferred Language</label>
              <select name="language" class="form-select">
                <option value="en">English</option>
                <option value="te">తెలుగు (Telugu)</option>
                <option value="hi">हिन्दी (Hindi)</option>
              </select>
            </div>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
              <input type="password" name="password" class="form-control" placeholder="Min. 6 characters" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Confirm Password <span class="text-danger">*</span></label>
              <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter password" required>
            </div>
          </div>

          <div class="d-grid mb-3">
            <button type="submit" class="btn btn-farmer-primary btn-touch-lg fw-bold">
              <i class="fa-solid fa-circle-check me-2"></i> Register Account
            </button>
          </div>

          <div class="text-center small text-muted">
            Already have an account?
            <a href="{{ url_for('auth.login') }}" class="text-success fw-bold">{{ t('login') }} here</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
