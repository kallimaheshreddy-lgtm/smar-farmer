services:
  - type: web
    name: smart-farmer-ai
    env: python
    buildCommand: python -m pip install -r requirements.txt && python seed_data.py
    startCommand: python -m gunicorn --bind 0.0.0.0:$PORT run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smartfarmer-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9

databases:
  - name: smartfarmer-db
    databaseName: smartfarmer
    user: smartfarmer_user
    plan: free
